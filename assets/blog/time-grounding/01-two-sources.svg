<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img"><rect width="960" height="390" fill="#FBFAF7"/><text x="45" y="48" font-family="Arial" font-size="27" font-weight="bold" fill="#222">Two sources of temporal mismatch</text><rect x="45" y="90" width="400" height="150" rx="12" fill="#FFFFFF" stroke="#0D9488" stroke-width="2"/><text x="245.0" y="120" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#242424">Conversation anchoring</text><text x="245.0" y="148" text-anchor="middle" font-family="Arial" font-size="15" fill="#666">Which time does the message mean?</text><rect x="515" y="90" width="400" height="150" rx="12" fill="#FFFFFF" stroke="#D97706" stroke-width="2"/><text x="715.0" y="120" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#242424">Time-sensitive facts</text><text x="715.0" y="148" text-anchor="middle" font-family="Arial" font-size="15" fill="#666">Which fact was valid then?</text><text x="245" y="206" text-anchor="middle" font-family="Arial" font-size="15" fill="#0D9488">History T₀ → follow-up T₁</text><text x="715" y="206" text-anchor="middle" font-family="Arial" font-size="15" fill="#D97706">Officeholder A at T₀ → B at T₁</text><rect x="215" y="282" width="530" height="82" rx="12" fill="#FFFFFF" stroke="#777777" stroke-width="2"/><text x="480.0" y="312" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#242424">Correct evaluation requires both</text><text x="480.0" y="340" text-anchor="middle" font-family="Arial" font-size="15" fill="#666">Resolve the target time, then verify facts for that time</text></svg>